name: Image

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the multi-arch image to registry.transpara.com
        required: false
        default: false
        type: boolean
      license_review_complete:
        description: Confirm docs/license-review.md approves the selected package variant
        required: false
        default: false
        type: boolean
      package_variant:
        description: TimescaleDB package variant to build
        required: true
        default: oss
        type: choice
        options:
          - oss
          - full

env:
  IMAGE_NAME: registry.transpara.com/transpara/timescale
  OSS_TAG: pg18.4-ts2.28.0-oss-toolkit1.23.0-cnpg-standard
  FULL_TAG: pg18.4-ts2.28.0-toolkit1.23.0-cnpg-standard

jobs:
  single-platform:
    name: Build and verify ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package variant
        run: |
          set -euo pipefail
          variant="${{ github.event_name == 'workflow_dispatch' && inputs.package_variant || 'oss' }}"
          if [ "$variant" = "full" ]; then
            tag="$FULL_TAG"
          else
            tag="$OSS_TAG"
          fi
          echo "PACKAGE_VARIANT=$variant" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Enforce publish license gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.license_review_complete }}
        run: |
          echo "Publishing requires license_review_complete=true after docs/license-review.md is approved." >&2
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build loadable image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/timescale:${{ matrix.suffix }}
          build-args: |
            TIMESCALEDB_PACKAGE_VARIANT=${{ env.PACKAGE_VARIANT }}
            IMAGE_VERSION=${{ env.IMAGE_TAG }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Verify image contract
        run: ./scripts/verify-image.sh local/timescale:${{ matrix.suffix }} ${{ matrix.platform }}

      - name: SQL smoke test
        if: matrix.platform == 'linux/amd64'
        run: ./scripts/smoke-test.sh local/timescale:${{ matrix.suffix }} ${{ matrix.platform }}

      - name: Trivy high and critical scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/timescale:${{ matrix.suffix }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/timescale:${{ matrix.suffix }}
          format: cyclonedx
          output: sbom-${{ matrix.suffix }}.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.suffix }}
          path: sbom-${{ matrix.suffix }}.cdx.json

  multiarch:
    name: Multi-arch build
    runs-on: ubuntu-latest
    needs: single-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package variant
        run: |
          set -euo pipefail
          variant="${{ github.event_name == 'workflow_dispatch' && inputs.package_variant || 'oss' }}"
          if [ "$variant" = "full" ]; then
            tag="$FULL_TAG"
          else
            tag="$OSS_TAG"
          fi
          echo "PACKAGE_VARIANT=$variant" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Transpara registry
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: registry.transpara.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            TIMESCALEDB_PACKAGE_VARIANT=${{ env.PACKAGE_VARIANT }}
            IMAGE_VERSION=${{ env.IMAGE_TAG }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Show published digest
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
